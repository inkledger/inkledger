version: 2
updates:
  # CI actions (pinned by commit): one grouped PR a week, only when there is news.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The app's npm dependencies: security fixes as they come, the rest grouped weekly.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # The native shell (Rust crates).
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # The server image's base (node, postgres client).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # The Android app's build.
  - package-ecosystem: gradle
    directory: /src-tauri/gen/android
    schedule:
      interval: monthly
