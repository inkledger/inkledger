name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # The dependency audit, weekly: advisories land without a code change.
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; no job writes to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "const p = require('./package.json'); if (process.env.TAG !== 'v' + p.version) throw new Error('Tag ' + process.env.TAG + ' does not match package.json v' + p.version)"
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:smoke

  e2e:
    # ubuntu-latest is Ubuntu 26.04 since 2026-10-19, which Playwright 1.57 cannot install a browser on.
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Never a real tracker from a test server.
      PROVIDERS_READ_ONLY: "1"
      JIRA_READ_ONLY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium-headless-shell
      # One file at a time: two browsers and servers at once overload the runner (timeouts that vary from run to run).
      - run: pnpm build && node --test --test-concurrency=1 --test-timeout=300000 'e2e/*.test.mjs'

  native:
    # The desktop shell: format, lints and tests (macOS: no system WebKit packages to install).
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  docker:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: inkledger:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image as it runs: on Postgres, migrated at boot, healthy, serving the page, backups working.
      - name: Run the container
        run: |
          docker network create ikl
          docker run -d --name db --network ikl -e POSTGRES_USER=inkledger -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=inkledger postgres:17-alpine
          for _ in {1..30}; do docker exec db pg_isready -U inkledger && break; sleep 1; done
          docker run -d --name app --network ikl -p 47823:47823 \
            -e DATABASE_URL=postgres://inkledger:ci@db:5432/inkledger \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e INKLEDGER_ADMIN_PASSWORD="$(openssl rand -hex 16)" \
            -e PROVIDERS_READ_ONLY=1 -e STORE_URL=off -e WEATHER=off -e SYNC_INTERVAL_MIN=0 \
            inkledger:ci
          for _ in {1..60}; do curl -fs http://127.0.0.1:47823/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:47823/api/health | grep -q '"ok"'
          curl -fs -H 'accept: text/html' http://127.0.0.1:47823/timesheet | grep -q 'id="root"'
          curl -fs -H 'accept: text/html' http://127.0.0.1:47823/login | grep -q 'id="inkledger-ssr-state"'
          curl -fs http://127.0.0.1:47823/offline.html | grep -q '<div id="root"></div>'
          docker exec db psql -U inkledger -d inkledger -Atc "select count(*) from drizzle.__drizzle_migrations" | grep -qv '^0$'
          docker exec app sh -c 'PGPASSWORD=ci pg_dump -h db -U inkledger -Fc inkledger > /tmp/ci.dump && test -s /tmp/ci.dump'
      - name: Logs
        if: failure()
        run: docker logs app
      # The forecast sidecar: its tests, then the image as it runs, with the stand-in model (no download).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ml/forecast
          target: test
          push: false
          cache-from: type=gha,scope=forecast
          cache-to: type=gha,scope=forecast,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ml/forecast
          push: false
          load: true
          tags: inkledger-forecast:ci
          cache-from: type=gha,scope=forecast
      - name: Run the forecast sidecar
        run: |
          docker run -d --name forecast -p 8601:8601 -e FORECAST_FAKE=1 inkledger-forecast:ci
          for _ in {1..60}; do curl -fs http://127.0.0.1:8601/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8601/health | grep -q '"up":true'
          for _ in {1..30}; do curl -fs http://127.0.0.1:8601/ready && break; sleep 1; done
          curl -fs -X POST http://127.0.0.1:8601/forecast -H 'content-type: application/json' \
            -d '{"series":[1,2,3,4,5,6,7],"freq":"D","horizon":3,"quantiles":[0.1,0.5,0.9]}' | grep -q '"0.5"'
      - name: Sidecar logs
        if: failure()
        run: docker logs forecast

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: publish
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, native]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: macos,
              os: macos-latest,
              bundle: dmg,
              artifacts: "src-tauri/target/release/bundle/dmg/*.dmg",
            }
          - {
              name: windows,
              os: windows-latest,
              bundle: nsis,
              artifacts: "src-tauri/target/release/bundle/nsis/*.exe",
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: pnpm install --frozen-lockfile
      - name: Build desktop installer
        run: pnpm tauri build --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 3

  audit:
    # Known advisories in what ships (prod dependencies), high and above: a failing check to triage.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: pnpm audit --prod --audit-level=high

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [e2e, image, desktop, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          pattern: desktop-*
          merge-multiple: true
      - name: Publish GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shasum -a 256 ./* > SHA256SUMS
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "inkledger $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber ./*

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, image]
    runs-on: [self-hosted, inkledger]
    environment: production
    concurrency:
      group: inkledger-production
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      INKLEDGER_ENV_FILE: ${{ vars.INKLEDGER_ENV_FILE }}
      INKLEDGER_RELEASE_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check deployment configuration
        run: test -n "$INKLEDGER_ENV_FILE" && test -f "$INKLEDGER_ENV_FILE" && test -n "$INKLEDGER_RELEASE_IMAGE"
      - name: Log in to GHCR while the package is private
        if: ${{ env.GHCR_READ_TOKEN != '' }}
        run: echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Back up and deploy the published image
        run: node scripts/docker-update.mjs
      - name: Application logs
        if: failure()
        run: docker logs --tail 100 inkledger
