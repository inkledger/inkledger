# Services for development on this machine, beside the app (docs/work/ideas/infra.md).
# Never the jtt stack, never staging: its own project, names and ports.
#   pnpm test:db          the e2e tests' Postgres (empty at every start)
#   pnpm dev:services     Ollama in a container (profile ai): CPU only on a Mac (no Metal in Docker);
#                         a native `ollama serve` is faster, the app only sees OLLAMA_URL either way
# The `ml` profile (the forecast sidecar) comes with its batch.
name: inkledger-dev

services:
  # Where the e2e tests make their throwaway databases (E2E_DATABASE_URL), away from
  # the production container. Data in memory: nothing survives a stop, nothing to clean.
  test-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: inkledger-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: inkledger
      # Local only (127.0.0.1) and empty: a fixed password is no secret worth keeping.
      POSTGRES_PASSWORD: inkledger-test
      POSTGRES_DB: inkledger
    ports:
      - "127.0.0.1:54331:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkledger -d inkledger"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local model for idea suggestions (docs/work/ideas/triage.md R-2.8): OLLAMA_URL=http://127.0.0.1:11434.
  ollama:
    profiles: [ai]
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    container_name: inkledger-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    mem_limit: 8g
    cpus: 4
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ollama-models:
